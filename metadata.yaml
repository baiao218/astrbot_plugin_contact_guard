name: astrbot_plugin_contact_guard
display_name: 联系闸门
short_desc: 挨骂或刷屏就闭嘴，然后把断联的决定权交给你
desc: |
  人格提示词能让她「不想吵」，但不能让她「真的不发消息」——
  模型只能产出文本，产出的东西总会被发出去。

  这是被截图证实的：对方连着骂了十几句，她一句不落地接，
  还越接越像论文（「这句话只有结论，没有依据」「因为我只存在于运算里」）。
  生气被演成了一场辩论，而辩论本身就是给对方的存在感。

  还有一种更难缠的：二十条「在吗」，一句脏话都没有。
  按词表打分永远是 0，但它照样能把会话淹掉。

  **它做什么**

  1. 打分：侮辱 2 分、邀战（对骂/互骂）4 分、贬低存在 1 分、
     命令式压迫（我让你…/回答我）1 分、重复追问同一句 1 分；
  2. 另算一套刷屏判定：60 秒内 ≥ 10 条、且相邻平均间隔 ≤ 4 秒；
  3. 任一条到线 → 把整个会话的 AI 关掉
     （`SessionServiceManager.set_llm_status_for_session(umo, False)`）。
     不是她不肯说，是这条消息根本进不到模型——不产出，也不耗 token；
  4. 同时把对方最近几句原文推给你，附上 `/断联` `/恢复`；
  5. 你说断联，就是永久的；说恢复，就解除静默并清零。

  **为什么刷屏要单独算**

  骂人是「说了什么」，刷屏是「怎么说的」。词表再长也抓不到后者，
  只能看到达间隔。而间隔必须用消息自己的时间戳
  （`message_obj.timestamp`），不能用插件处理的时刻——
  两者之间隔着限流阶段，一波刷屏会被摊成「每十几秒一条」的正常聊天。

  **为什么不用每轮 `stop_event()`**

  `stop_event()` 只管当前这条消息，下一句照样进来。会话级开关写在
  `session_service_config` 里，重启之后依然生效，也没有插件能绕过去。

  **安全阀**

  一直不给答复时，静默会在 `mute_ttl_hours`（默认 12）小时后自动解除。
  规则判错一次会误伤正常朋友，而你可能根本没看到上报。
  `/断联` 不受这个限制，是永久的。

  **边界**

  只管私聊。群聊里骂人会把整个群静音，不是想要的效果。
  **情绪会传出去**

  触发静默、判定刷屏、断联的时候，会把「她现在什么心情」写给跨端共享状态
  （`~/.julia/state.json`），工作台上她带着这个情绪干活。
  没装跨端桥也没关系——写不进去就跳过，不影响拦截。

  而且不会降级：被骂到「生气」之后，对方再刷几条屏，情绪不会被冲淡成「有点烦」。
  只有 `/恢复` 或者回一个「留」，才会压回「平静」。

help: |
  **命令（管理员）**

  - `/断联 [QQ]` —— 永久断开，此后不再回复。不带参数时作用于最近一次上报的人
  - `/恢复 [QQ]` —— 解除静默或断联，AI 开关一并打开
  - `/静默 [QQ]` —— 手动闭嘴，但不算断联，超时会自动恢复
  - `/联系状态` —— 查看断联 / 静默名单与当前阈值

  **也可以不敲指令**

  收到上报后直接回一个「断」或一个「留」就行。
  只在「有人正等着裁决 + 上报后 6 小时内 + 短句白名单」三条都成立时才认，
  所以「我今天断网了」不会被当成断联。

  **词表原则**

  只收「基本没有第二种解释」的词。`滚` 不收，因为「滚烫」；
  `蠢` 不收，因为「不蠢」。这类误伤比漏判贵得多——漏判只是她多挨一句，
  误伤是得罪一个正常朋友，还得你去解释。

  漏网的常用词补到 `extra_insult_words` 里。

  **刷屏参数怎么调**

  两个条件必须同时满足：窗口内条数够多（`burst_count`），
  并且相邻平均间隔够短（`burst_gap_sec`）。只满足一个都不触发。
  一句一句打十条家常、平均六秒一条的人不会中招；
  真正刷屏的手速通常 1~3 秒一条。
